name: Release Please

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check if commit message contains 'release'
        id: check_commit_message
        run: |
          # Get the latest commit message
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MESSAGE"

           # Set output variable to determine if release should proceed
          if [[ "$COMMIT_MESSAGE" != *"chore(release)"* ]]; then
            echo "Commit message doesn't contain 'chore(release)'. Skipping release."
            echo "skip_release=true" >> $GITHUB_ENV  # Set an environment variable to skip the release step
          else
            echo "Commit message contain 'chore(release)'. Proceeding with release."
            echo "skip_release=false" >> $GITHUB_ENV  # Proceed with the release step
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Release Please Action
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          package-name: '@ashk1996/boiler'
          token: ${{ secrets.GITHUB_TOKEN }}
        if: env.skip_release == 'false' # Run this step only if the commit message contains 'chore(release)'
