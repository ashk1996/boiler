name: Release Please

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check if commit message contains 'release'
        id: check_commit_message
        run: |
          # Get the latest commit message
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MESSAGE"

          # Check if the commit message contains the word 'release'
          if [[ "$COMMIT_MESSAGE" != *"chore(release)"* ]]; then
            echo "Commit message doesn't contain 'release'. Skipping release."
            exit 0
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Release Please Action
        uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          package-name: '@ashk1996/boiler'
          token: ${{ secrets.GITHUB_TOKEN }}
